<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block titulo %}Pokédex{% endblock %}</title>
    <style>
      :root {
        --bg: #fcf8f5;
        --card-bg: #ffffff;
        --border: #f0e6df;
        --text-main: #2c2c2c;
        --text-muted: #8c8c8c;
        --red: #e3350d;
        --red-dark: #c42d0b;
        --red-light: #fdeceb;
        --radius: 16px;
        --radius-sm: 10px;
        --shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
      }

      a { text-decoration: none; color: inherit; }

      .app-layout { display: flex; min-height: 100vh; }

      .page { flex: 1; min-width: 0; padding: 32px 40px; }

      /* ---------- Botões reutilizados em todas as páginas ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px 18px;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
      }
      .btn-primary { background: var(--red); color: white; }
      .btn-primary:hover { background: var(--red-dark); }
      .btn-secondary { background: var(--card-bg); color: var(--text-main); border-color: var(--border); }
      .btn-secondary:hover { background: #f6f1ea; }
      .btn-icon {
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--card-bg);
      }

      /* ---------- Card genérico ---------- */
      .card {
        background: var(--card-bg);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      /* ---------- Badge de tipo (bolinha colorida + nome) ---------- */
      .type-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
        background: #f6f1ea;
        color: var(--text-main);
      }
      .type-badge .dot { width: 8px; height: 8px; border-radius: 50%; }

      /* ---------- Sidebar (menu lateral) ---------- */
      .sidebar {
        width: 240px;
        flex-shrink: 0;
        background: var(--card-bg);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .sidebar-top { padding: 24px 16px; }
      .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 0 8px 24px; }
      .sidebar-logo .ball {
        width: 32px; height: 32px; border-radius: 50%;
        background: conic-gradient(var(--red) 0deg 180deg, #2c2c2c 180deg 185deg, white 185deg 360deg);
        border: 2px solid #2c2c2c;
        position: relative;
      }
      .sidebar-logo .ball::after {
        content: ''; position: absolute; top: 50%; left: 50%;
        width: 10px; height: 10px; background: white;
        border: 2px solid #2c2c2c; border-radius: 50%;
        transform: translate(-50%, -50%);
      }
      .sidebar-logo h1 { font-size: 16px; }
      .sidebar-logo span { display: block; font-size: 11px; color: var(--text-muted); }
      .sidebar-nav { display: flex; flex-direction: column; gap: 4px; }
      .sidebar-link {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px; border-radius: var(--radius-sm);
        font-size: 14px; font-weight: 500; color: var(--text-main);
      }
      .sidebar-link:hover { background: #f6f1ea; }
      .sidebar-link.active { background: var(--red-light); color: var(--red); }
      .sidebar-trainer {
        margin: 16px; padding: 12px; border-radius: var(--radius-sm);
        background: #f6f1ea; display: flex; align-items: center; gap: 10px;
      }
      .sidebar-trainer .avatar {
        width: 32px; height: 32px; border-radius: 50%;
        background: var(--red); color: white;
        display: flex; align-items: center; justify-content: center;
        font-weight: bold; font-size: 14px; flex-shrink: 0;
      }
      .sidebar-trainer .name { font-size: 13px; font-weight: 600; }
      .sidebar-trainer .detail { font-size: 11px; color: var(--text-muted); }

      {% block estilos %}{% endblock %}
    </style>
  </head>
  <body>
    <div class="app-layout">
      {% include 'includes/_sidebar.html' %}
      <main class="page">
        {% block conteudo %}{% endblock %}
      </main>
    </div>
  </body>
</html>
